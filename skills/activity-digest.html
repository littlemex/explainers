<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/activity-digest — skills シリーズ</title>
<style>
  :root{--bg:#f4f7f5;--ink:#12211a;--sub:#4a5d54;--g1:#0f5132;--g2:#198754;--g4:#8fd6b4;--card:#fff;--line:#d9e5df}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
  header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:56px 24px 44px;text-align:center}
  header .kicker{font-size:14px;letter-spacing:.18em;opacity:.85;margin:0 0 10px}
  header h1{margin:0;font-size:34px}
  main{max-width:760px;margin:0 auto;padding:36px 20px 80px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;font-size:16px}
  .back{display:inline-block;margin:0 0 22px;color:var(--g2);text-decoration:none;font-size:14px}
</style>
</head>
<body>
<header>
  <p class="kicker">SKILLS ・ 情報収集</p>
  <h1>/activity-digest</h1>
</header>
<main>
  <a class="back" href="./index.html">← skills シリーズへ戻る</a>
  <div class="box">
    <p>GitHub や Hugging Face で、指定したリポジトリや特定の方のこの 1 週間の公開活動を集め、日本語の 1 枚の HTML にまとめるスキルです。集めた記録は手元にだけ残し、それを使って 1 か月や半年の流れも振り返ります。</p>
  </div>
</main>
</body>
</html>
