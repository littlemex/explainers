<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>explainers — 技術解説・可視化アーカイブ</title>
<style>
  :root{
    --bg:#f4f7f5; --ink:#12211a; --sub:#4a5d54;
    --g1:#0f5132; --g2:#198754; --g3:#43b581; --g4:#8fd6b4;
    --card:#ffffff; --line:#d9e5df;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.8}
  header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:64px 24px 52px;text-align:center}
  header h1{margin:0 0 10px;font-size:38px;letter-spacing:.04em}
  header p{margin:0;opacity:.92;font-size:17px}
  main{max-width:960px;margin:0 auto;padding:36px 20px 80px}
  .intro{color:var(--sub);font-size:16px;margin:0 0 30px;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 24px 20px;
    text-decoration:none;color:inherit;display:flex;flex-direction:column;
    box-shadow:0 2px 14px rgba(15,81,50,.05);transition:.18s}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(15,81,50,.14);border-color:var(--g3)}
  .card .cat{display:inline-block;background:var(--g4);color:var(--g1);border-radius:6px;
    padding:2px 10px;font-size:12.5px;font-weight:700;align-self:flex-start;margin-bottom:12px}
  .card h2{margin:0 0 8px;font-size:20px;color:var(--g1);line-height:1.4}
  .card p{margin:0 0 16px;font-size:14.5px;color:var(--sub);flex:1}
  .card .meta{font-size:12.5px;color:#9aa;display:flex;justify-content:space-between;align-items:center}
  .card .go{color:var(--g2);font-weight:700}
  footer{text-align:center;color:var(--sub);font-size:13.5px;padding:24px}
  footer a{color:var(--g2)}
</style>
</head>
<body>
<header>
  <h1>explainers</h1>
  <p>技術トピックを「動かして分かる」ように解説・可視化するアーカイブ</p>
</header>
<main>
  <p class="intro">論文・データセット・概念などを、読んで動かして直感で掴めるよう HTML にまとめています。増えていく予定です。</p>
  <div class="grid">

    <a class="card" href="./flow-matching-explainer.html">
      <span class="cat">生成モデル</span>
      <h2>Flow Matching をゼロから直感で掴む</h2>
      <p>ノイズがデータへ「流れる」様子と、直線をつないで平均すると正しい速度場が現れる核心トリックを、動くアニメーションで理解する。元記事の Meta Flow Matching への橋渡しつき。</p>
      <div class="meta"><span>2026-07-26</span><span class="go">開く →</span></div>
    </a>

  </div>
</main>
<footer>
  <a href="https://github.com/littlemex/explainers" target="_blank" rel="noopener">GitHub: littlemex/explainers</a>
</footer>
</body>
</html>
